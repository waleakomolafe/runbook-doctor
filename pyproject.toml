[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runbook-doctor"
version = "0.1.0"
description = "Staleness gate for runbooks: dead scripts, dead links, undefined variables, TODO rot."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wale Akomolafe" }]
keywords = ["runbook", "documentation", "sre", "ci", "lint"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
runbook-doctor = "runbook_doctor.cli:main"

[tool.setuptools.packages.find]
include = ["runbook_doctor*"]
